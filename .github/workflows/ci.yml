          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/ridelink_ride_db
      JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret-123456789
      JWT_ISSUER: ridelink-account

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
