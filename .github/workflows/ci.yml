name: RideLink CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  account-service:
    name: Account Service
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/ridelink_account_db
      JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret-123456789
      JWT_ISSUER: ridelink-account

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: account-service
        run: chmod +x mvnw

      - name: Test Account Service
        working-directory: account-service
        run: ./mvnw -B clean test


  driver-service:
    name: Driver & Vehicle Service
    runs-on: ubuntu-latest

    services:
